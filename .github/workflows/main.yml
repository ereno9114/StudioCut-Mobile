name: Build Android APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
      - run: pip install flet==0.24.1
      - run: flet build apk --project studio_cut --module-name main
      - uses: actions/upload-artifact@v4
        with:
          name: StudioCut-Android-APK
          path: build/apk/*.apk
